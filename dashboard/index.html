<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#264227">
  <title>Riziki · Prosopis map</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="brand-name">Riziki</span>
      <span class="brand-sub">Prosopis map</span>
    </div>
    <div class="top-right">
      <span id="net" class="net" role="status">Online</span>
      <a id="logout" class="signout" hidden>Sign out</a>
      <button id="lockbtn" class="signout" type="button" hidden>Lock</button>
    </div>
  </header>

  <div id="lock" class="lock" hidden>
    <form id="lock-form" class="lock-card">
      <p class="eyebrow">Riziki</p>
      <h1>Prosopis map</h1>
      <label for="lock-pw">Password</label>
      <input id="lock-pw" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit">Open the map</button>
      <p id="lock-msg" class="small" role="alert"></p>
    </form>
  </div>

  <div id="banner" class="banner" role="alert" hidden></div>

  <main class="layout">
    <div id="map" aria-label="Map of Kenya. Zoom in and tap a square to choose an area."></div>
    <aside id="panel" class="panel" aria-live="polite">
      <button id="sheet" class="sheet-handle" aria-label="Show or hide details"></button>
      <div id="panel-body"></div>
    </aside>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>

  <noscript><p class="noscript">This map needs JavaScript turned on.</p></noscript>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="height.js"></script>
  <script src="lock.js"></script>
  <script src="app.js"></script>
</body>
</html>
